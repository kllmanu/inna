<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101612" />
    <title>Nava AR Hello</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <header class="fhv-header" aria-label="FHV header">
      <div class="fhv-logo" aria-label="FHV logo">
        <span>INNA</span>
      </div>
    </header>

    <a-scene embedded renderer="alpha: true" arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker preset="hiro">
        <a-box
          position="0 0.5 0"
          material="color: #f06449; roughness: 0.35;"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"
        ></a-box>
        <a-text
          value="Hello, world!"
          align="center"
          color="#ffffff"
          position="0 1.25 0"
          scale="1.2 1.2 1.2"
        ></a-text>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    <script type="module" src="/index.ts"></script>
  </body>
</html>
