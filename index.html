<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101612" />
    <title>INNA</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <header class="fhv-header" aria-label="FHV header">
      <a class="fhv-logo" href="/" aria-label="INNA home">
        <span>INNA</span>
      </a>
    </header>

    <main id="camera-fallback" class="camera-fallback" aria-live="polite">
      <h1 id="camera-heading">Indoor Navigation</h1>
      <p id="camera-message">Checking AR support…</p>
      <button id="camera-start" type="button" disabled>Checking AR…</button>
      <button id="marker-start" type="button" hidden>Use marker camera</button>
    </main>

    <button
      id="camera-toggle"
      class="camera-toggle"
      type="button"
      aria-expanded="false"
    >
      Expand camera
    </button>

    <section class="campus-map" aria-label="FHV campus map">
      <div class="campus-map-stage">
        <img
          id="campus-map-image"
          src="./uvw.svg"
          alt="Map of the FHV U, V and W buildings"
        />
      </div>
      <p id="compass-status" role="status">
        North-aligned map. Start the experience to enable the compass.
      </p>
      <button id="compass-start" type="button" hidden>Retry compass</button>
    </section>

    <div id="xr-overlay">
      <p id="xr-status" role="status">Move your phone to find a surface, then tap to place the arrow.</p>
      <button id="xr-exit" type="button">Exit AR</button>
    </div>

    <template id="webxr-scene-template">
      <a-scene
        class="webxr-scene"
        embedded
        renderer="alpha: true"
        vr-mode-ui="enabled: false"
        webxr="referenceSpaceType: local; requiredFeatures: hit-test; optionalFeatures: dom-overlay; overlayElement: #xr-overlay"
        ar-hit-test="target: #xr-arrow"
      >
        <a-entity id="xr-arrow" visible="false">
          <a-entity
            position="0 0.1 0"
            direction-arrow="length: 0.45; direction: 0 0 -1; color: red"
          ></a-entity>
        </a-entity>
        <a-entity camera position="0 0 0" look-controls="enabled: false"></a-entity>
      </a-scene>
    </template>

    <template id="ar-scene-template">
      <a-scene
        embedded
        renderer="alpha: true"
        arjs="sourceType: webcam; debugUIEnabled: false;"
      >
        <a-marker preset="hiro">
          <a-entity
            position="0 0.15 0"
            direction-arrow="length: 1.5; direction: 0 0 1; color: red"
          ></a-entity>
        </a-marker>
        <a-entity camera></a-entity>
      </a-scene>
    </template>
    <script type="module" src="/index.ts"></script>
  </body>
</html>
