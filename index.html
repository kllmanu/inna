<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101612" />
    <title>INNA</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <header class="fhv-header" aria-label="FHV header">
      <a class="fhv-logo" href="/" aria-label="INNA home">
        <span>INNA</span>
      </a>
    </header>

    <main id="camera-fallback" class="camera-fallback" aria-live="polite">
      <h1 id="camera-heading">Indoor navigation</h1>
      <p id="camera-message">Enable camera access to start the experience.</p>
      <button id="camera-start" type="button">Enable camera</button>
    </main>

    <section class="campus-map" aria-label="FHV campus map">
      <div class="campus-map-stage">
        <img id="campus-map-image" src="./uvw.svg" alt="Map of the FHV U, V and W buildings" />
      </div>
      <p id="compass-status" role="status">North-aligned map. Enable the compass to follow your heading.</p>
      <button id="compass-start" type="button">Enable compass</button>
    </section>

    <template id="ar-scene-template">
      <a-scene embedded renderer="alpha: true" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-marker preset="hiro">
          <a-entity
            position="0 0.15 0"
            direction-arrow="length: 1.5; direction: 0 0 1; color: red"
          ></a-entity>
        </a-marker>
        <a-entity camera></a-entity>
      </a-scene>
    </template>
    <script type="module" src="/index.ts"></script>
  </body>
</html>
