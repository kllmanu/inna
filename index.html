<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101612" />
    <title>INNA</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <header class="fhv-header" aria-label="FHV header">
      <a class="fhv-logo" href="/" aria-label="INNA home">
        <span>INNA</span>
      </a>
    </header>

    <main id="camera-fallback" class="camera-fallback" aria-live="polite">
      <h1 id="camera-heading">Indoor navigation</h1>
      <p id="camera-message">Enable camera access to start the experience.</p>
      <button id="camera-start" type="button">Enable camera</button>
    </main>

    <template id="ar-scene-template">
      <a-scene embedded renderer="alpha: true" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-marker preset="hiro">
          <a-entity position="0 0.15 0" scale="1.8 1.8 1.8">
            <a-cylinder
              position="0 0 0"
              rotation="0 0 -90"
              radius="0.045"
              height="0.75"
              material="color: #ffdc5f; roughness: 0.35;"
            ></a-cylinder>
            <a-cone
              position="0.55 0 0"
              rotation="0 0 -90"
              radius-bottom="0.15"
              radius-top="0"
              height="0.36"
              material="color: #ffdc5f; roughness: 0.35;"
            ></a-cone>
          </a-entity>
          <a-text
            camera-facing
            value="U310"
            align="center"
            color="#ffffff"
            position="0 0.85 0"
            scale="0.7 0.7 0.7"
          ></a-text>
        </a-marker>
        <a-entity camera></a-entity>
      </a-scene>
    </template>
    <script type="module" src="/index.ts"></script>
  </body>
</html>
